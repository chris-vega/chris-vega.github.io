<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="author" content="{{ site.author.name }}">
<title>{{ page.title }} | {{ site.title }} — {% if page.lang == 'es' %}Líder de Continuidad del Negocio en TI y Tecnólogo Creativo{% else %}Technology Business Continuity Lead & Creative Technologist{% endif %}</title>
<meta name="description" content="{% if page.lang == 'es' %}Chris Vega — Líder de Continuidad del Negocio en Tecnología y Seguridad, Especialista en Resiliencia y Tecnólogo Creativo (Fotografía, Video, Drone y Artes Escénicas).{% else %}{{ site.description }} — Specializing in enterprise technology resilience, BCP/DR, vendor cyber risk remediation, and creative technology.{% endif %}">

<link rel="shortcut icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<!-- Alternate language links for SEO -->
<link rel="alternate" hreflang="en" href="https://chris-vega.us/" />
<link rel="alternate" hreflang="es" href="https://chris-vega.us/es/" />
<link rel="alternate" hreflang="x-default" href="https://chris-vega.us/" />

<!-- Google Fonts: Plus Jakarta Sans, JetBrains Mono, Cormorant Garamond -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/styles.min.css?v={{ site.time | date: '%s' }}">

<!-- Early theme script to avoid FOUC -->
<script>
  (function() {
    var savedTheme = sessionStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.setAttribute("data-theme", savedTheme);
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<script src="/assets/js/darkmode.js?v={{ site.time | date: '%s' }}" defer></script>
<script src="/assets/js/main.js?v={{ site.time | date: '%s' }}" defer></script>

<script data-goatcounter="https://chris-vega.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
